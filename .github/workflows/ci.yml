name: ci

on:
  push:
    branches: [ main, master, develop, dev ]
    tags:     [ "v*" ]
  pull_request:
    branches: [ main, master, develop, dev ]
  workflow_dispatch:

# Default permissions are read-only; jobs that need to write (release) opt in.
permissions:
  contents: read

# A single in-flight run per branch. New pushes cancel older queued runs so
# CI doesn't pile up on rapid-fire commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so deterministic builds embed a real commit

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Cache the NuGet HTTP cache + global packages folder. Keyed off the
      # central package versions file so a version bump invalidates the cache.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore GameFlow.sln --locked-mode || dotnet restore GameFlow.sln

      - name: Build
        run: dotnet build GameFlow.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GameFlow.sln --configuration Release --no-build --logger "trx" --logger "console;verbosity=normal" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  publish:
    name: Publish ${{ matrix.rid }}
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest, ext: zip    }
          - { rid: linux-x64, os: ubuntu-latest,  ext: tar.gz }
          - { rid: osx-arm64, os: macos-latest,   ext: tar.gz }
          - { rid: osx-x64,   os: macos-15-intel, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/GameFlow.App/GameFlow.App.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -p:Version=${GITHUB_REF_NAME#v} \
            -o publish/${{ matrix.rid }}

      - name: Package zip
        if: matrix.ext == 'zip'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          7z a -tzip "../../GameFlow-${GITHUB_REF_NAME}-${{ matrix.rid }}.zip" *

      - name: Package tar.gz
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf "../../GameFlow-${GITHUB_REF_NAME}-${{ matrix.rid }}.tar.gz" *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameFlow-${{ matrix.rid }}
          path: GameFlow-*-${{ matrix.rid }}.${{ matrix.ext }}

  release:
    name: Create GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The tag's own notes, if CHANGELOG.md has a section for it. Kept
      # out of the release step so a missing or renamed section is a
      # visible skip in the log rather than a release that quietly ships
      # with nothing but an auto-generated commit list.
      - name: Extract release notes for this tag
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f CHANGELOG.md ]; then
            echo "No CHANGELOG.md — falling back to generated notes only."
            exit 0
          fi
          # Everything between this version's heading and the next one.
          awk -v tag="## ${GITHUB_REF_NAME}" '
            $0 == tag        { capture = 1; next }
            /^## /           { if (capture) exit }
            capture          { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "path=release-notes.md" >> "$GITHUB_OUTPUT"
            echo "Using CHANGELOG.md section for ${GITHUB_REF_NAME}."
          else
            echo "::warning::CHANGELOG.md has no '## ${GITHUB_REF_NAME}' section; using generated notes only."
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # body_path supplies the curated notes; generate_release_notes
          # appends the commit and contributor list underneath them.
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: artifacts/**/*
